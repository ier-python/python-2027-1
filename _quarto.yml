project:
  type: book
  output-dir: _book
  pre-render: scripts/genera_indice.py
  resources:
    - recursos/pdfs/*.pdf

book:
  title: "Proyectos de ciencia de datos con Python"
  subtitle: "Semestre 2027-1 · Posgrado en Ingeniería (Energía), UNAM"
  author: "Guillermo Barrios del Valle"
  date: today
  date-format: "D [de] MMMM [de] YYYY"
  repo-url: https://github.com/ier-python/python-2027-1
  repo-actions: [source, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "Instituto de Energías Renovables · UNAM"
    right: "Hecho con [Quarto](https://quarto.org)"

  chapters:
    - index.qmd
    - temario.qmd

    # ── Numeración automática: cada unidad es un capítulo numerado (1–8).
    #    Las libretas de clase se cuelgan con un part de título de texto que
    #    agrupa a la unidad y sus libretas; cada libreta declara {.unnumbered}
    #    en su título (primera celda Markdown) para NO consumir número de
    #    capítulo. Ejemplo:
    #
    #    - part: "Unidad 1"
    #      chapters:
    #        - unidades/unidad-01.qmd                             # capítulo 1
    #        - clases/clase-01-introduccion/notebooks/01-entorno.ipynb   # {.unnumbered}

    - unidades/unidad-01.qmd
    - unidades/unidad-02.qmd
    - unidades/unidad-03.qmd
    - unidades/unidad-04.qmd
    - unidades/unidad-05.qmd
    - unidades/unidad-06.qmd
    - unidades/unidad-07.qmd
    - unidades/unidad-08.qmd

    # Los apéndices van como una parte final —en vez de `appendices:`—
    # para que no reciban la etiqueta "Apéndice A".
    - part: "Apéndices"
      chapters:
        - apendices/instalacion.qmd

format:
  html:
    theme: [cosmo, estilos.scss]
    # Numeración automática: unidades como capítulos 1–8, temas como N.M.
    # index, temario y apéndices van {.unnumbered} en su título.
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    code-tools: false
    toc: true
    toc-depth: 3
    toc-title: "En esta página"

# Las libretas NO se ejecutan al renderizar: el libro publica las salidas
# que quedaron guardadas en el .ipynb al trabajarlo en su propio entorno uv.
execute:
  enabled: false

lang: es
